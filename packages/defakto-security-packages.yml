note: >-
  Defakto distributes very little through the mainstream language registries. The one
  registry-resolvable library is the Go SDK, published through the Go module proxy. The CLI
  ships as a Homebrew formula and as signed tarballs on a first-party S3 bucket; the
  infrastructure provider is published to the OpenTofu registry and is NOT present on the
  HashiCorp Terraform registry (registry.terraform.io/v1/providers/spirl/spirl returned 404
  on 2026-08-12), so `terraform init` cannot resolve it from the default registry without an
  explicit `registry.opentofu.org/spirl/spirl` source line — which is exactly what the
  provider's own release notes instruct. No npm, PyPI, Maven, NuGet, RubyGems, Packagist or
  crates.io packages were found under either the `spirl` or `defakto` names.
