note: >-
  Defakto publishes a separate dated release-notes page per shipped component — eight of them
  — rather than one product changelog. Entries are categorised (Security Fixes, Bug Fixes,
  Enhancements, Breaking Changes) and breaking changes are called out under their own heading
  rather than buried, which is the mark of a changelog written for operators. Security fix
  entries name the specific upstream CVE and state reachability in Defakto's own deployment
  context, which is materially better than the usual "updated dependencies" line.
  There is no product-wide changelog, no RSS/Atom feed for release notes, and no changelog
  covering the Management API contract itself — API-visible additions have to be inferred from
  the SDK and CLI notes.
