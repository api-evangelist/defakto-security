  note: >-
    Defakto publishes no id-prefix reference page. The prefixes below are read off real
    identifier values printed in the OCSF audit-log examples and CLI/Terraform snippets in the
    documentation, so each one is evidenced rather than inferred from the entity name.
  prefixes:
  - prefix: sak-
    entity: ServiceAccountKey
    evidence: 'spirlctl login --service-account-key-id sak-1234; terraform provider sa_key_id = "sak-abcd1234"'
  - prefix: td-
    entity: TrustDomain
    evidence: 'OCSF audit event tag trust_domain_id = "td-kscgxiupol"'
  - prefix: tdd-
    entity: TrustDomainDeployment
    evidence: 'OCSF audit event tag trust_domain_deployment_id = "tdd-0c9009b3ed"'
  - prefix: c-
    entity: Cluster
    evidence: 'OCSF audit event tag cluster_id = "c-55zzfbmonu"'
  - prefix: cv-
    entity: ClusterVersion
    evidence: 'OCSF audit event tag cluster_version_id = "cv-kwalu86v7w"'
  unprefixed:
  - entity: TrustDomainWorkload
    identifier: spiffe_id
    note: Workloads are identified by their SPIFFE ID URI, not by an opaque prefixed id.
  - note: >-
      Realm, User, ServiceAccount, Role, CICDProfile, Scanner and the remaining entities expose
      an opaque `id` string with no prefix observed in any published example. No prefix is
      asserted for them.
