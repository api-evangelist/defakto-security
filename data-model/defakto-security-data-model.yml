derived_from: >-
  The 390 protobuf messages reconstructed in grpc/, themselves read from the generated
  bindings published in github.com/spirl/spirl-sdk-go. Relationships are taken from real
  *_id reference fields and real embedded message types — nothing here is inferred from
  naming alone unless marked confidence: medium.
note: >-
  The Defakto object graph is a strict containment hierarchy rooted at the Organization.
  A trust domain is the SPIFFE trust root; realms subdivide it for delegated administration;
  clusters attach to a trust domain (optionally inside a realm); agents run in clusters and
  attest workloads; every credential minted is emitted as an SVIDIssuedEvent. Identity
  (service accounts, roles, sessions) and the Ledger secret scanner hang off the org
  alongside that hierarchy rather than inside it.
