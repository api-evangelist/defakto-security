  // JWT-specific attributes, if applicable.
  JWTAttributes jwt_attributes = 10;
  // X.509-specific attributes, if applicable.
  X509Attributes x509_attributes = 11;
  // Workload attestation key-value pairs.
  repeated Attribute workload_attestation = 12;
  // Provider attestation key-value pairs.
  repeated Attribute provider_attestation = 13;
  // Workload attestor extensions used during issuance.
  repeated WorkloadAttestor workload_attestor_extensions = 14;
  // ID of the signing keyset used to issue the credential.
  string key_set_id = 15;
}

message AgentAttestationAttributes {
  // Type of attestation performed.
  string attestation_type = 1;
  // Whether the attestation succeeded.
  bool success = 2;
  // Deprecated. Use error instead.  Deprecated: Marked as deprecated in
  // api/v1/statisticsapi/api.proto.
  string error_message = 3;
  // Name of the attestation extension used.
  string extension_name = 4;
  // Version of the attestation extension used.
  string extension_version = 5;
  // Agent ID that performed the attestation.
  string agent_id = 6;
  // Cluster ID where the attestation occurred.
  string cluster_id = 7;
  // Cluster version ID at the time of attestation.
  string cluster_version_id = 8;
  // Error message if the attestation failed.
  string error = 9;
}

message WorkloadCredentialErrorAttributes {
  // RPC method that was called.
  string rpc = 1;
  // Issuer type.
  IssuerType issuer_type = 2;
  // Issuer ID.
  string issuer_id = 3;
  // Issuer parent ID (e.g. cluster ID for cluster issuer).
  string issuer_parent_id = 4;
  // SVID type (e.g. x509, jwt).
  string svid_type = 5;
  // SPIFFE ID, if it was derived before the error occurred.
  string spiffe_id = 6;
  // Error message describing the failure.
  string error = 7;
  // The operation being performed when the error occurred (e.g. "issue").
  string operation = 8;
  // The broad error category (e.g. "issuance_error").
  string category = 9;
  // Agent ID that requested the credential.
  string agent_id = 10;
}

service API {
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc Count(CountRequest) returns (CountResponse);
  rpc HealthEvents(HealthEventsRequest) returns (HealthEventsResponse);
  rpc SVIDIssuedEvents(SVIDIssuedEventsRequest) returns (SVIDIssuedEventsResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc DescribeAgents(DescribeAgentsRequest) returns (DescribeAgentsResponse);
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  rpc ListActivityFeed(ListActivityFeedRequest) returns (ListActivityFeedResponse);
}
