message QueryRequest {
  // Required. Trust domain to query for statistics.
  string trust_domain_id = 1;
  // Required. Statistic to query.  Supported statistics:  - workload.credentials_issued: Count
  // of credentials issued in a given time range - workload.active_credentials: Count of active,
  // non-expired credentials in a given time range - workload.active_workloads: Count of distinct
  // SPIFFE IDs in active credentials in a given time range - health_events.count: Count of
  // health events in a given time range
  string statistic = 2;
  // Start of time range for query.
  google.protobuf.Timestamp from_ts = 3;
  // End of time range for query.
  google.protobuf.Timestamp to_ts = 4;
  // Bucket interval size for query.
  uint32 interval_ms = 5;
  // Deprecated. Use query_filters for better operator support.  Deprecated: Marked as deprecated
  // in api/v1/statisticsapi/api.proto.
  map<string, string> filters = 6;
  // Optional. Filters to narrow the query. Supported fields vary by statistic:
  // workload.credentials_issued, workload.active_credentials, workload.active_workloads: *
  // trust_domain_id * svid_type                    — SVID type (e.g. X509, JWT) * type
  // — deprecated alias for svid_type * issuer_type                  — type of issuer (e.g.
  // cluster, developer-identity) * spiffe_id * trust_domain_deployment_name *
  // trust_domain_replica_id * issuer_id * issuer_parent_id  health_events.count: *
  // trust_domain_id * error_message * event_name * event_description  Multiple filters are
  // combined with AND logic.
  repeated FieldFilter query_filters = 7;
}

