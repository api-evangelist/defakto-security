note: >-
  Defakto's lifecycle discipline is the strongest thing in this profile after the contract
  itself. It publishes a numeric support window, a per-version EOL date table for every
  shipped component, a validated agent/server compatibility matrix with an explicit statement
  that a blank cell means "not tested" rather than "incompatible", and dated release notes per
  component. What it does NOT have is a status page — there is no status.defakto.security or
  status.spirl.com in DNS — so no StatusPage pointer is emitted.
versioning:
  scheme: semver
  api_version: v1
  api_version_style: proto package path (com.spirl.api.v1.*)
  component_versioning: >-
    Each shipped component versions independently: spirl-server (trust domain server),
    spirl-system (agent-side), spirlctl, spirldbg, spirl-perf, spirl-sync, spirl-sdk-go,
    terraform-provider.
deprecation_policy:
  published: true
  url: https://d.defakto.security/releases/end-of-life.md
  support_window: 18 months from each minor version's release date
  patch_policy: >-
    Patch releases supersede all prior patches in the same minor immediately on release; only
    the latest patch of a minor is supported. Patches are cumulative, non-breaking, and safe
    to apply without configuration changes.
  minor_policy: >-
    Every minor is designed backward-compatible within the same major. Direct upgrades
    spanning up to 3 minor versions are formally validated (e.g. 0.27.0 to 0.30.0); larger
    jumps are expected to work and any breakage is treated as a bug.
  runtime_signalling:
    sunset_header: false
    deprecation_header: false
    note: Policy is documentation-only; no RFC 8594 headers are documented on any response.
  caveat: >-
    The page itself carries the disclaimer "This page is updated periodically and may not
    reflect the latest information."
