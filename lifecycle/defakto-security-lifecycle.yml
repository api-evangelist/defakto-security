compatibility_matrix:
  published: true
  url: https://d.defakto.security/releases/compatibility-matrix.md
  last_updated: '2026-08-06'
  semantics: >-
    Each cell marks an agent/trust-domain-server pair validated together against a promoted
    release. A blank cell means "not tested", explicitly not "incompatible" — Defakto states
    it records only measured pairs and never infers compatibility for untested pairs or
    version ranges. That is an unusually honest matrix.
status_page:
  published: false
  probed:
  - url: https://status.defakto.security/
    result: NXDOMAIN
  - url: https://status.spirl.com/
    result: NXDOMAIN
  note: >-
    No public status page or uptime history. For a control plane that gates credential
    issuance across a customer's whole estate, this is the most consequential operational gap
    in the profile. No StatusPage pointer emitted.
sla:
  published: false
  note: No SLA or uptime commitment is published on any public page.
deprecated_surfaces:
- surface: api.spirl.com / app.spirl.com / auth.api.spirl.com
  state: legacy-but-live
  evidence: >-
    Listed in the published network-requirements allowlist as "Management API (legacy
    app.spirl.com console)" and "Authentication for the spirlctl CLI and legacy web UI"
    alongside the current api.defakto.security hosts. Both answer on 443 today.
  sunset_date: null
  note: >-
    Labelled legacy but given no announced retirement date, and the spirlctl CLI still
    authenticates against auth.api.spirl.com rather than the defakto.security equivalent.
    A dated sunset would close this.
- surface: SPIRL brand naming inside the product
  state: partial-migration
  evidence: >-
    Component and binary names remain SPIRL-prefixed after the rebrand — spirlctl, spirldbg,
    spirl-server, spirl-system, spirl-sync, spirl-perf, spirl-sdk-go, SPIRL Bridge, SPIRL
    Reflector — and the Homebrew formula still lists homepage "https://www.spirl.com/". The
    Go module path is still github.com/spirl/spirl-sdk-go and the proto package is still
    com.spirl.api.v1.*, so the rename cannot be completed without a breaking change.
