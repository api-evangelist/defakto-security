apis:
- aid: defakto-security-management-api
  name: Defakto Management API
  description: 'The Defakto control-plane API. A gRPC service surface of sixteen versioned
    services covering trust domains, clusters, realms, workloads, access policy, service
    accounts and sessions, agent and provider attestation, CI/CD profiles, federation,
    developer identity, managed configuration, alerts, statistics and the Ledger secret
    scanner. It is the API behind the console at console.defakto.security and the spirlctl
    CLI. There is no REST/OpenAPI surface: the transport is gRPC over HTTP/2 on port 443,
    and the contract is distributed as generated client bindings in the Go SDK rather than
    as published .proto files.'
  humanURL: https://d.defakto.security/
