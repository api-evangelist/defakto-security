aid: defakto-security
name: Defakto Security
description: 'Defakto (formerly SPIRL) is a non-human identity (NHI) security company that
  issues short-lived, cryptographically attested identities to workloads, services, CI/CD
  pipelines and AI agents in place of static secrets, API keys and long-lived service accounts.
  The platform is built on SPIFFE and ships two products: Mint, which runs Trust Domain Servers
  and Agents that mint X.509-SVIDs, JWT-SVIDs and proof-of-possession WIT-SVIDs for Kubernetes,
  Linux, Docker and serverless workloads under a dozen attestation methods; and Ledger, which
  discovers, risk-scores and eradicates static secrets across AWS, Azure, GCP, Kubernetes,
  Anthropic, OpenAI, Bedrock AgentCore and Gemini. The control plane is driven by a gRPC
  management API and the spirlctl CLI, with a Go SDK, an OpenTofu/Terraform provider, workload
  identity federation into AWS/Azure/GCP, and OCSF 1.8.0 audit logging.'
url: https://raw.githubusercontent.com/api-evangelist/defakto-security/refs/heads/main/apis.yml
image: https://www.defakto.security/wp-content/uploads/2025/09/defakto-logo.svg
