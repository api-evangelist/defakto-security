note: >-
  Every /.well-known/ path probed on every Defakto host returned a miss. No WellKnown or
  SecurityTxt pointer is emitted in apis.yml, because this file records an ABSENCE, not a
  surface the provider serves. Two failure shapes are worth separating:
  (1) the marketing site and the docs site are ordinary SPAs/WordPress that return an HTML
  404 body for every unknown path — a real 404, not a soft-200;
  (2) api.defakto.security and api.spirl.com answer 415 with content-type application/grpc
  on EVERY path including /.well-known/*. That is not a 404 — it is a pure gRPC listener
  rejecting a non-gRPC content type, and it means well-known discovery is structurally
  unavailable on the API hosts rather than merely unimplemented.
  fed.spirl.org, which the docs describe as serving "SPIFFE Bundle and OIDC metadata",
  returned 403 with an XML body (an S3-style AccessDenied) at the root and at
  /.well-known/openid-configuration — the OIDC metadata is served per trust domain under a
  path this profile cannot enumerate anonymously, not at the host root.
